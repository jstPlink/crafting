<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Crafting — Marianan Station (mockup)</title>
<meta name="viewport" content="width=device-width, initial-scale=1">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Rajdhani:wght@500;600;700&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#06080b;
  --panel:#0f1115;
  --line:#23272c;
  --row:#2c2f34;
  --row-hi:#3a3e44;
  --txt:#e9edf0;
  --dim:#8b949c;
  --accent:#f4623a;
  --accent-2:#ff8a5c;
  --good:#63e07a;
  --bad:#ff5a5a;
  --warn:#ffb547;
  --pri:#d6574b;
  --sec:#d9a521;
  --eng:#2f86ea;
  --pow:#2e7dff;
  --ic-bg:#474d55;
  --font:"Rajdhani","Bahnschrift","Barlow Condensed","Segoe UI",system-ui,sans-serif;
}
*{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%;background:#000;overflow:hidden;font-family:var(--font);color:var(--txt);user-select:none;-webkit-user-select:none}
button{font:inherit;color:inherit;background:none;border:0;cursor:pointer}

#stage{position:absolute;left:50%;top:50%;width:1920px;height:1080px;transform-origin:center;overflow:hidden;background:var(--bg)}

/* ---------- scene ---------- */
.scene{position:absolute;inset:0;background:#0c0f12}

/* ---------- top bar ---------- */
#top{position:absolute;left:0;top:0;width:100%;height:160px;pointer-events:none}
#top>*{pointer-events:auto}
.hud{position:absolute;left:80px;top:34px;display:flex;align-items:center;gap:18px}
.emblem{width:72px;height:72px;border-radius:50%;border:2px solid #667;background:radial-gradient(circle,#1b1f24,#0b0d10);display:grid;place-items:center;}
.hud-bars{width:230px}
.hud-bar{display:flex;align-items:center;gap:8px;font-size:15px;color:var(--dim);height:20px}
.hud-bar b{width:52px;font-weight:600;color:#cfd6dc;text-align:right}
.segs{flex:1;display:flex;gap:2px}
.segs i{flex:1;height:8px;background:#22262b}
.segs i.on.g{background:#3ddb54}.segs i.on.b{background:#2f86ea}
.hud-speed{margin-top:6px;background:#15181c;text-align:center;font-size:16px;padding:2px 0;border-radius:2px;color:#cfd6dc;width:120px;margin-left:56px}
.hud-lv{width:26px;height:26px;border-radius:50%;border:2px solid var(--good);color:var(--good);display:grid;place-items:center;font-size:13px;font-weight:700;align-self:flex-start;margin-top:16px}

.station{position:absolute;left:50%;top:38px;transform:translateX(-50%);min-width:340px;text-align:center;font-size:36px;font-weight:700;letter-spacing:.06em;
  padding:6px 50px;clip-path:polygon(22px 0,calc(100% - 22px) 0,100% 50%,calc(100% - 22px) 100%,22px 100%,0 50%);background:#0a0c0f;
  border:0;box-shadow:inset 0 0 0 1px #4a4f55}
.station-wrap::before{content:"";position:absolute;left:0;right:0;top:66px;height:1px;background:#2f3439}
.tabs{position:absolute;left:50%;top:98px;transform:translateX(-50%);display:flex;align-items:center;gap:0;width:900px;justify-content:space-between;font-size:18px;letter-spacing:.04em}
.tab{padding:10px 30px;color:#cfd6dc;position:relative;white-space:nowrap}
.tab.act{color:var(--accent-2)}
.tab.act::before,.tab.act::after{content:"";position:absolute;top:0;bottom:0;width:10px;border:2px solid var(--accent)}
.tab.act::before{left:0;border-right:0}.tab.act::after{right:0;border-left:0}
#build{position:absolute;right:80px;top:110px;font-size:13px;letter-spacing:.12em;color:#59626a;text-align:right}
.credits{position:absolute;right:80px;top:44px;border:2px solid var(--accent);color:var(--accent-2);padding:12px 24px;font-size:24px;letter-spacing:.05em;background:#1c1616}

/* ---------- glyphs ---------- */
.gp,.key{font-style:normal;display:inline-flex;align-items:center;justify-content:center;vertical-align:middle;font-weight:700;line-height:1}
.gp{width:26px;height:26px;border-radius:50%;font-size:14px;background:#22262b;border:2px solid #555c64;color:#dfe5ea}
.gp.a{border-color:#5ed26e;color:#5ed26e}.gp.b{border-color:#ee5f5f;color:#ee5f5f}.gp.x{border-color:#5aa2ff;color:#5aa2ff}.gp.y{border-color:#f0c24a;color:#f0c24a}
.gp.pill{border-radius:8px;width:auto;min-width:34px;padding:0 7px;height:24px;font-size:13px}
.gp.rs{background:#1a1d21}
.gp svg{width:16px;height:16px}
.key{min-width:30px;height:26px;padding:0 8px;border-radius:4px;background:#22262b;border:1px solid #59606a;border-bottom-width:3px;color:#dfe5ea;font-size:14px}

/* ---------- panels ---------- */
.panel{position:absolute;background:var(--panel);border:1px solid var(--line);}
#left{left:40px;top:180px;width:450px;padding-bottom:16px}
.lp-head{display:flex;align-items:stretch;height:46px;background:var(--accent);color:#fff;margin:0 0 0 0;
  clip-path:polygon(0 0,100% 0,100% 100%,0 100%)}
.lp-head .ic{width:56px;background:#e8e8e8;display:grid;place-items:center;color:var(--accent)}
.lp-head .nm{flex:1;padding:0 16px;font-size:26px;font-weight:700;letter-spacing:.05em;display:flex;align-items:center}
.lp-head .pw{display:flex;align-items:center;gap:8px;padding-right:16px;font-size:24px;font-weight:700}
.lp-head .pw svg{width:24px;height:24px}
.lp-head .pw .n{color:#9dff9d}.lp-head .pw .n.warn{color:#fff2a0}.lp-head .pw .n.bad{color:#ffd0d0}
.lp-body{padding:6px 20px 0}
.sec-title{display:flex;justify-content:space-between;align-items:baseline;font-size:17px;font-weight:700;letter-spacing:.06em;color:#dfe5ea;margin:12px 0 6px}
.sec-title span{font-weight:600;color:var(--dim);font-size:15px}
.slot{display:flex;align-items:center;height:42px;margin-bottom:4px;background:linear-gradient(#34373c,#2a2d31);cursor:pointer;position:relative;
  border:1px solid transparent;transition:background .12s}
.slot:hover{background:linear-gradient(#3d4148,#30343a)}
.slot .ic{width:38px;height:100%;display:grid;place-items:center;color:#fff}
.slot .ic svg{width:22px;height:22px}
/* module type is told by the icon only: colours are reserved for socket size, rarity and states */
.slot.pri .ic,.slot.sec .ic,.slot.eng .ic{background:var(--ic-bg)}
.slot .nm{flex:1;padding:0 12px;font-size:20px;font-weight:600;letter-spacing:.02em;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.slot .pwr{display:flex;align-items:center;gap:3px;font-size:16px;color:var(--dim);margin-right:8px}
.slot .pwr svg{width:12px;height:12px}
.slot .unq{width:34px;height:100%;display:grid;place-items:center;color:#c34b4b;font-size:18px;font-weight:700;border-left:1px solid #1c1e21}
.slot .unq:hover{background:#c34b4b;color:#fff}
.slot .unq svg{width:14px;height:14px}
.slot .kh{margin-right:8px}
.slot.empty{background:#0f1115;border:1px dashed #4b5158}
.slot.empty .ic{background:#0f1115;color:#69727a;border-right:1px dashed #4b5158}
.slot.empty .nm{color:#6b747c;font-weight:500;font-size:17px;letter-spacing:.08em;text-transform:uppercase}
.slot.empty:hover{background:#16181c}
.slot.sel{border-color:var(--accent);box-shadow:0 0 0 1px var(--accent)}
.slot.sel.focus{background:linear-gradient(#55402f,#3d2f25)}
.slot.sel.empty.focus{background:#2a1a15}
.slot.hov{background:linear-gradient(#3d4148,#30343a)}
.slot.pv-add .nm::after{content:" → NEW";color:var(--good);font-size:14px}
.slot.pv-rem .nm{color:#8a4a4a;text-decoration:line-through}
.slot.flash{animation:flash .9s ease-out}
@keyframes flash{0%{box-shadow:0 0 0 2px var(--good);background:#2f5a3a}100%{}}

/* ---------- right column ---------- */
#right{position:absolute;left:1410px;top:180px;width:470px;height:780px;background:none;border:0;box-shadow:none;display:flex;flex-direction:column}
.ov,.cg{background:var(--panel);border:1px solid var(--line);}
.ov{flex:none}
.head{height:44px;display:flex;align-items:center;justify-content:space-between;padding:0 18px;background:var(--accent);color:#fff;font-size:26px;font-weight:700;letter-spacing:.04em;
  clip-path:polygon(0 0,100% 0,calc(100% - 14px) 100%,0 100%)}
.head small{font-size:15px;font-weight:600;color:#ffe3d8;letter-spacing:.06em}
.ov-body{padding:10px 20px 6px}
.pw-row{display:flex;align-items:center;gap:16px;padding-bottom:10px;border-bottom:1px solid var(--line)}
.pw-row .lbl{width:104px;white-space:nowrap;font-size:15px;color:var(--dim);letter-spacing:.06em;line-height:1.1}
.pw-row .lbl b{display:block;white-space:nowrap;font-size:26px;color:var(--txt);letter-spacing:.02em;margin-top:2px}
.pw-row .lbl b.bad{color:var(--bad)}
.pbar{flex:1;display:flex;gap:2px;height:26px;align-items:stretch}
.pbar i{flex:1;background:#23272c;position:relative}
.pbar i.on{background:var(--pow)}
.pbar i.add{background:var(--good)}
.pbar i.over{background:var(--bad)}
.pbar i.rem{background:repeating-linear-gradient(45deg,#4a2a2a 0 4px,#2a1a1a 4px 8px);outline:1px solid #a03a3a;outline-offset:-1px}
.stats{display:grid;grid-template-columns:1fr 1fr;border-bottom:1px solid var(--line)}
.st{display:flex;align-items:center;gap:14px;padding:8px 8px;position:relative}
.st:nth-child(2n){border-left:1px solid var(--line);padding-left:22px}
.st .si{width:34px;height:34px;color:#d6dbe0;display:grid;place-items:center}
.st .si svg{width:32px;height:32px}
.st .sl{font-size:14px;color:var(--dim);letter-spacing:.08em}
.st .sv{font-size:26px;font-weight:700;line-height:1}
.st .sv{white-space:nowrap}
.st .sv small{font-size:15px;font-weight:600;margin-left:3px;color:var(--dim)}
.st>div:nth-child(2){min-width:0}
/* diffs never take layout space: fixed slots / absolute badges that just appear and disappear */
.st .sd{position:absolute;right:8px;bottom:9px;font-size:15px;font-weight:700;padding:1px 6px;border-radius:2px}
.sd.off{visibility:hidden}
.dslot{flex:none;width:62px;display:flex;justify-content:flex-end}
.dslot .sd{font-size:16px;font-weight:700;padding:1px 7px;border-radius:2px}
.up{color:var(--good)}.dn{color:var(--bad)}.wn{color:var(--warn)}.nt{color:#cfd6dc}
.sd.up{background:#1a3324}.sd.dn{background:#351a1c}.sd.wn{background:#35291a}.sd.nt{background:#22262b}
.sv.up{color:var(--good)}.sv.dn{color:var(--bad)}.sv.nt{color:var(--txt)}
.wrow{display:grid;grid-template-columns:104px 1fr 1fr 1fr;align-items:center;padding:8px 0;border-top:1px solid var(--line)}
.wrow:first-of-type{border-top:0}
.wrow .rl{font-size:15px;color:var(--dim);letter-spacing:.06em}
.wc{display:flex;align-items:center;gap:8px;height:34px}
.wc svg{width:20px;height:20px;color:#b9c0c7;flex:none}
.wc .v{font-size:24px;font-weight:700;line-height:1}
.wc .v.zero{color:#5c646b;font-weight:600}
.wc .d{font-size:14px;font-weight:700}
.wc.k svg{color:#e8695c}.wc.e svg{color:#f0a04b}.wc.n svg{color:#5cb4ff}
.wrows{padding-top:2px}

.cg{margin-top:10px;flex:1;min-height:0;display:flex;flex-direction:column}
.cg .target{padding:8px 18px 4px;font-size:15px;color:var(--dim);letter-spacing:.06em;display:flex;justify-content:space-between}
.cg .target b{color:var(--txt);font-weight:600}
.cats{display:flex;align-items:center;gap:6px;padding:4px 14px 8px}
.cat{flex:1;text-align:center;font-size:15px;font-weight:700;letter-spacing:.06em;padding:7px 0;background:#1e2126;color:var(--dim);border-bottom:3px solid transparent;cursor:pointer}
.cat i{font-style:normal;margin-left:4px;color:#69727a}
.cat.act{color:#fff;background:#2b2f35}
.cat.act{border-color:var(--accent)}
.cg-list{flex:1;overflow-y:auto;padding:0 14px 10px;scrollbar-width:thin;scrollbar-color:#3a3f46 transparent}
.cg-row{display:flex;align-items:center;gap:12px;height:66px;padding:0 12px 0 0;margin-bottom:5px;background:linear-gradient(#2f3237,#282b30);cursor:pointer;border:1px solid transparent;position:relative}
.cg-row .ic{width:46px;align-self:stretch;display:grid;place-items:center;color:#fff}
.cg-row.pri .ic,.cg-row.sec .ic,.cg-row.eng .ic{background:var(--ic-bg)}
.cg-row .ic svg{width:24px;height:24px}
.cg-row .mid{flex:1;min-width:0}
.cg-row .nm{font-size:20px;font-weight:700;letter-spacing:.02em;display:flex;gap:8px;align-items:baseline}
.cg-row .nm small{font-size:15px;color:var(--dim);font-weight:600}
.chips{display:flex;gap:12px;font-size:15px;color:#c3cad1;margin-top:3px;white-space:nowrap}
.chip{display:inline-flex;align-items:center;gap:4px}
.chip svg{width:12px;height:12px}
.chip em{font-style:normal;font-weight:700;font-size:13px}
.cg-row .act{flex:none;width:118px;justify-content:flex-end;font-size:14px;font-weight:700;letter-spacing:.1em;color:var(--accent-2);display:flex;align-items:center;gap:6px;white-space:nowrap}
.cg-row.nopow .act{color:var(--bad)}
.cg-row.nopow .nm{color:#c9aaaa}
.cg-row.hov,.cg-row:hover{background:linear-gradient(#3b3f45,#30343a)}
.cg-row.sel{border-color:var(--accent);background:linear-gradient(#55402f,#3d2f25);box-shadow:0 0 0 1px var(--accent)}
.cg-empty{padding:40px 30px;text-align:center;color:#6b747c;font-size:18px;letter-spacing:.05em;line-height:1.5}

/* ---------- ship (3D) ---------- */
#shipbox{position:absolute;left:490px;top:168px;width:920px;height:468px;cursor:grab;background:#0c0f12;overflow:hidden}
#shipbox:active{cursor:grabbing}
#shipbox canvas{display:block;width:100%;height:100%;outline:0}
.tag3d{position:absolute;left:0;top:0;transform:translate(-50%,-100%);background:#0a0c0f;border:2px solid var(--accent);padding:4px 12px 5px;text-align:center;pointer-events:none;white-space:nowrap;display:none}
.tag3d small{display:block;font-size:13px;font-weight:600;letter-spacing:.1em;color:var(--dim)}
.tag3d b{display:block;font-size:17px;letter-spacing:.06em;color:#fff}
.tag3d.hv{border-color:#8b949c}


/* ---------- sockets / pylons ---------- */
#left{height:auto;max-height:780px;display:flex;flex-direction:column;padding-bottom:0}
.lp-body{overflow-y:auto;flex:1;min-height:0;padding:6px 20px 14px;scrollbar-width:thin;scrollbar-color:#3a3f46 transparent}
.sec-title .st-l{display:flex;align-items:center;gap:8px}
.sg{flex:none;display:block}
.slot{height:38px;margin-left:calc(var(--d,0)*24px)}
.slot .ic{width:36px}
/* tree line: from the bottom of the parent pylon row (--up rows above) down to the middle of this row */
.slot.child::before{content:"";position:absolute;left:-15px;width:12px;border-left:2px solid #3a3f46;border-bottom:2px solid #3a3f46;
  top:calc(-1 * ((var(--up,1) - 1) * 42px + 5px));height:calc((var(--up,1) - 1) * 42px + 5px + 18px);pointer-events:none}
/* heat meter (continuous: heatsink values are too large for segments) */
.heat-row{padding-top:8px}
.hbar{flex:1;height:14px;background:#23272c;position:relative;overflow:hidden}
.hbar i{position:absolute;top:0;bottom:0;left:0}
.hbar i.cur{background:#e0782f}
.hbar i.add{background:var(--warn)}
.hbar i.rem{background:repeating-linear-gradient(45deg,#4a2a2a 0 4px,#2a1a1a 4px 8px)}
.hbar.hot i.cur,.hbar.hot i.add{background:var(--bad)}
.hwrap{flex:1;display:flex;flex-direction:column;gap:4px}
.hwrap .hbar{flex:none}
.hstat{font-size:13px;font-weight:700;letter-spacing:.1em}
.hstat.ok{color:var(--good)}.hstat.no{color:var(--bad)}
/* explanation tooltip (hover the "?") */
.tip{position:relative;display:inline-grid;place-items:center;width:15px;height:15px;margin-left:6px;border-radius:50%;border:1px solid #6b747c;color:#cfd6dc;font-size:11px;font-weight:700;cursor:help;vertical-align:1px}
.tipbox{display:none;position:absolute;right:calc(100% + 10px);top:-12px;width:330px;padding:12px 14px;background:#0a0c0f;border:1px solid var(--accent);z-index:40;
  font-size:15px;font-weight:500;letter-spacing:.02em;line-height:1.4;color:#cfd6dc;text-align:left;white-space:normal}
.pw-row .lbl .tipbox b{display:inline;font-size:inherit;font-weight:700;letter-spacing:inherit;color:#fff;margin:0}
.pw-row .lbl .tipbox>b:first-child{display:block;font-size:16px;letter-spacing:.1em;margin-bottom:6px}
.pw-row .lbl .tipbox b.ok{color:var(--good)}.pw-row .lbl .tipbox b.no{color:var(--bad)}
.tipnum{display:block;margin-top:8px;padding-top:8px;border-top:1px solid #23272c;color:var(--dim);font-size:14px}
.tip:hover .tipbox{display:block}
.pw-row .lbl{overflow:visible}
.valrow{display:flex;align-items:center;justify-content:space-between;padding:4px 0 10px;margin-bottom:8px;border-bottom:1px solid var(--line)}
.valrow .rl{font-size:15px;color:var(--dim);letter-spacing:.1em}
.valrow .val{display:flex;align-items:center;gap:10px}
.valrow .val svg{width:22px;height:22px;color:var(--accent-2)}
.valrow .val b{font-size:38px;line-height:1;color:#fff;letter-spacing:.02em}
.valrow .sd{font-size:16px;font-weight:700;padding:1px 7px}

/* ---------- view mode: ship only ---------- */
#viewui{display:none}
#stage.viewmode #shipbox{left:0;top:0;width:1920px;height:1080px;z-index:25}
#stage.viewmode #viewui{display:block}
#stage.viewmode .tag3d{display:none!important}
#stage.viewmode>*:not(#shipbox):not(.scene):not(#toast){visibility:hidden}
.vhint{position:absolute;left:0;right:0;bottom:34px;text-align:center;font-size:15px;letter-spacing:.14em;color:#6b747c;pointer-events:none}
#viewexit{position:absolute;right:40px;top:34px;display:flex;align-items:center;gap:10px;font-size:17px;font-weight:700;letter-spacing:.1em;color:#cfd6dc;
  padding:8px 16px;background:rgba(10,12,15,.7);border:1px solid #3a3f46}
#viewexit:hover{border-color:var(--accent);color:#fff}
.st .sl{white-space:nowrap;font-size:13px;letter-spacing:.06em}
.st .sl i{font-style:normal;color:#5c646b;font-size:12px}
#card .ch .fam{margin-left:auto;font-size:13px;letter-spacing:.12em;color:var(--dim);font-weight:600}
#card table{font-size:16px}
#card td{padding:2px 16px}
#card th{padding:6px 16px 3px}
/* rarity */
.rdot{display:inline-block;flex:none;width:10px;height:10px;margin-right:8px;background:var(--rc);box-shadow:0 0 6px var(--rc);vertical-align:1px}
.cg-row{height:48px}
.slot.rar .ic,.cg-row.rar .ic{box-shadow:inset -4px 0 0 var(--rc)}
/* rarity tint: colour fading from the icon side into the row */
.slot.rar,.cg-row.rar{background:linear-gradient(90deg,color-mix(in srgb,var(--rc) 38%,#2c2f34) 0%,color-mix(in srgb,var(--rc) 12%,#2c2f34) 45%,#2a2d31 100%)}
.slot.rar:hover,.slot.rar.hov,.cg-row.rar:hover,.cg-row.rar.hov{background:linear-gradient(90deg,color-mix(in srgb,var(--rc) 48%,#3a3e44) 0%,color-mix(in srgb,var(--rc) 18%,#3a3e44) 45%,#34373c 100%)}
.slot.rar.sel.focus,.cg-row.rar.sel{background:linear-gradient(90deg,color-mix(in srgb,var(--rc) 40%,#55402f) 0%,#55402f 45%,#3d2f25 100%)}
.slot.rar{border-bottom-color:color-mix(in srgb,var(--rc) 55%,transparent)}
.slot.rar.sel{border-color:var(--accent)}
.cg-row.rar{border-left:0}
.tag3d b .rdot{vertical-align:2px}
.slot.pyl .ic{background:var(--ic-bg)}
.slot.free{background:#0f1115;border:1px dashed #4b5158}
.slot.free .ic{background:#0f1115;border-right:1px dashed #4b5158}
.slot.free .nm{color:#6b747c;font-weight:500;font-size:17px;letter-spacing:.06em}
.slot.free:hover{background:#16181c}
.slot.sel.free.focus{background:#2a1a15}
.slot .sg{margin-right:8px}
.outs{display:flex;gap:5px;align-items:center;margin-right:10px}
.outs .sg{margin:0}
.outs.rt{justify-content:flex-end;margin-right:0}
.st{padding:6px 8px}
.wc{height:30px}
.wrow{padding:5px 0;grid-template-columns:110px 1fr 1fr 1fr}
.wc.sk .v i{font-style:normal;color:var(--dim);font-size:16px;font-weight:600}
.cat{font-size:13px;padding:7px 0;letter-spacing:.04em}
.cg-row.pyl .ic{background:var(--ic-bg)}
.cg .target{align-items:center}
.cg .target span{display:flex;align-items:center;gap:6px}
#card .ch .tg{display:inline-flex;align-items:center;gap:6px;background:#1c2025;border:1px solid #3a3f46;font-size:14px}
#card .kids{display:flex;gap:10px;flex-wrap:wrap;margin-top:12px}
.kidchip{display:inline-flex;align-items:center;gap:6px;background:#1c2025;padding:4px 10px;font-size:16px;color:#dfe5ea}
.kidchip i{color:#6b747c;font-style:normal}
.retline{padding:8px 16px;font-size:15px;color:var(--warn);letter-spacing:.04em;border-top:1px solid #16181b}
#card small.tot{color:#6b747c;font-size:13px;font-weight:600}


/* ---------- main body selector ---------- */
.lp-head.bodysel .ic{width:46px}
.lp-head.bodysel .nm{gap:6px;padding:0 8px;font-size:23px;white-space:nowrap}
.lp-head.bodysel .pw{white-space:nowrap;font-size:22px;gap:6px;padding-right:12px}
.lp-head.bodysel .pw svg{width:20px;height:20px}
.bsb{width:26px;height:30px;background:#e4542f;color:#fff;font-size:26px;font-weight:700;line-height:1;display:grid;place-items:center;padding-bottom:3px}
.bsb:hover{background:#fff;color:var(--accent)}
.bname{cursor:pointer}
.bname:hover{text-decoration:underline}
.lp-head.bodysel .nm{flex:none}
/* fixed-width name so the ‹ › buttons never move when the body changes */
.bname{width:150px;text-align:center;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.bunl{display:flex;flex-direction:column;justify-content:center;align-items:center;margin-left:auto;padding:0 10px;font-size:18px;font-weight:700;line-height:1;border-left:1px solid #ff9b7d;border-right:1px solid #ff9b7d}
.bunl small{font-size:10px;letter-spacing:.12em;color:#ffe3d8;margin-bottom:2px}
.lp-head.focus{box-shadow:inset 0 0 0 3px #fff}
#picker{position:absolute;left:510px;top:180px;width:880px;height:780px;background:#0c0e11;border:1px solid #2a2d31;z-index:30;display:none;flex-direction:column}
#picker.show{display:flex}
.pk-head{height:46px;background:var(--accent);color:#fff;font-size:26px;font-weight:700;letter-spacing:.05em;display:flex;align-items:center;justify-content:space-between;padding:0 20px;flex:none}
.pk-head small{font-size:15px;color:#ffe3d8;letter-spacing:.1em}
.pk-grid{flex:1;overflow-y:auto;padding:20px;display:grid;grid-template-columns:1fr 1fr;gap:18px;align-content:start;scrollbar-width:thin;scrollbar-color:#3a3f46 transparent}
.bcard{background:#14171b;border:2px solid #23272c;cursor:pointer;display:flex;flex-direction:column}
.bcard.cur{border-color:#3d6a49}
.bcard.sel{border-color:var(--accent);background:#211914}
.bc-head{display:flex;align-items:baseline;gap:12px;padding:12px 16px 6px}
.bc-head b{font-size:28px;letter-spacing:.05em}
.bc-head small{font-size:14px;font-weight:700;letter-spacing:.12em;color:var(--dim)}
.bc-use{margin-left:auto;font-size:13px;font-weight:700;letter-spacing:.12em;background:#1f3d29;color:var(--good);padding:2px 8px}
.bc-mid{display:flex;gap:14px;padding:6px 16px}
.schem{width:190px;height:190px;flex:none;background:#0f1215}
.bc-stats{flex:1;display:flex;flex-direction:column;justify-content:center;gap:6px}
.bc-stats div{display:flex;justify-content:space-between;align-items:baseline;border-bottom:1px solid #23272c;padding-bottom:4px}
.bc-stats span{font-size:14px;letter-spacing:.1em;color:var(--dim)}
.bc-stats b{font-size:22px}
.bc-foot{display:flex;justify-content:space-between;align-items:center;padding:10px 16px 14px;font-size:16px;color:var(--dim)}
.bc-cnt{display:flex;align-items:center;gap:8px}
.bc-cnt b{color:var(--txt);font-size:20px;margin-right:8px}

/* ---------- compare card ---------- */
#card{position:absolute;left:560px;top:640px;width:780px;min-height:262px;background:#0a0c0f;border:1px solid #2a2d31;}
#card .ch{display:flex;align-items:center;gap:12px;height:44px;padding:0 16px;border-bottom:1px solid var(--line);font-size:20px;font-weight:700;letter-spacing:.05em}
#card .ch .tg{font-size:14px;letter-spacing:.1em;color:#fff;padding:2px 8px;background:#555}

#card .ch .arrow{color:var(--accent-2)}
#card .ch .old{color:var(--dim)}
#card table{width:100%;border-collapse:collapse;font-size:19px}
#card th{font-size:13px;letter-spacing:.12em;color:var(--dim);font-weight:600;text-align:right;padding:8px 16px 4px}
#card th:first-child{text-align:left}
#card td{padding:5px 16px;text-align:right;font-weight:600;border-top:1px solid #16181b}
#card td:first-child{text-align:left;color:#cfd6dc;font-weight:600;display:flex;align-items:center;gap:10px}
#card td:first-child svg{width:16px;height:16px;color:#aab2ba}
#card td.o{color:var(--dim)}
#card td.dl{width:110px;font-weight:700}
#card .cf{display:flex;align-items:center;justify-content:space-between;padding:10px 16px;border-top:1px solid var(--line);font-size:17px;letter-spacing:.05em;color:var(--dim);background:#121417}
#card .cf .ok{color:var(--good);font-weight:700}
#card .cf .no{color:var(--bad);font-weight:700}
#card .cf b{color:var(--txt)}
#card .emptyc{padding:20px 16px;color:#7b848c;font-size:18px;letter-spacing:.04em;line-height:1.5}

/* ---------- bottom bar ---------- */
#bottom{position:absolute;left:0;bottom:0;width:100%;height:100px;display:flex;align-items:center;justify-content:space-between;padding:26px 80px 0}
.hints{display:flex;gap:34px;align-items:center}
.hint{display:flex;align-items:center;gap:10px;font-size:19px;letter-spacing:.06em;color:#c9d0d6;text-transform:uppercase;position:relative;padding:6px 0;cursor:pointer}
.hint.off{color:#4a5158;cursor:not-allowed}
.hint .g{display:flex;gap:4px}
.hint.hold::after{content:"";position:absolute;left:0;bottom:0;height:3px;width:calc(var(--p,0)*100%);background:var(--accent)}
.hint .ht{font-size:12px;color:var(--dim);letter-spacing:.1em}
.rightbar{display:flex;align-items:center;gap:26px}
.inputpill{font-size:13px;letter-spacing:.12em;color:#7b848c;border:1px dashed #4b5158;padding:6px 12px;border-radius:14px}
.inputpill:hover{color:#fff;border-color:#8b949c}
#dbgRandom{position:absolute;left:80px;top:128px;z-index:5}
.dbgbtn{font-size:13px;letter-spacing:.12em;color:#c9a0ff;border:1px dashed #7a5aa8;padding:6px 12px;border-radius:14px}
.dbgbtn:hover{color:#fff;border-color:#c9a0ff;background:#241a33}
.leave{position:relative;overflow:hidden;background:#c93c2c;color:#fff;padding:9px 22px;font-size:22px;letter-spacing:.06em;display:flex;align-items:center;gap:12px;font-weight:600;
  clip-path:polygon(10px 0,100% 0,100% 100%,0 100%,0 10px)}
.leave::before{content:"";position:absolute;inset:0;background:#e0766a;transform-origin:left;transform:scaleX(var(--p,0))}
.leave>*{position:relative}
.leave .key,.leave .gp{background:#8a2a20;border-color:#e08a80;color:#fff}

/* ---------- toast / overlay ---------- */
#toast{position:absolute;left:50%;top:150px;transform:translate(-50%,-10px);visibility:hidden;padding:8px 22px;font-size:20px;font-weight:700;letter-spacing:.06em;background:#0a0c0f;border:1px solid var(--good);color:var(--good);pointer-events:none;z-index:20}
#toast.show{visibility:visible;transform:translate(-50%,0)}
#toast.bad{border-color:var(--bad);color:var(--bad)}
#toast.info{border-color:#8b949c;color:#dfe5ea}
#leave-ov{position:absolute;inset:0;background:#000;display:none;place-items:center;font-size:40px;letter-spacing:.3em;color:var(--accent-2);z-index:50;cursor:pointer}
#leave-ov.show{display:grid}
#leave-ov small{display:block;font-size:16px;color:var(--dim);letter-spacing:.14em;text-align:center;margin-top:14px}

/* ---------- 0.4.1 · experiment "keyStats": key stat on every row, delta, BEST, sorting ---------- */
.slot .ks{display:flex;align-items:center;justify-content:flex-end;gap:4px;min-width:44px;margin-right:6px;font-size:16px;font-weight:700;color:#dfe5ea}
.slot .ks svg{width:12px;height:12px;color:var(--dim)}
.cg-row.two{height:58px}
.cg-row.two .nm{display:block;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.cg-row .sub{display:flex;align-items:center;gap:10px;margin-top:2px;font-size:16px;font-weight:600;color:var(--dim);white-space:nowrap}
.cg-row .sub b{font-weight:700;color:var(--txt)}
.cg-row .sub .q{color:#c3cad1}
.dlt{font-weight:700}
.dlt.up{color:var(--good)}.dlt.dn{color:var(--bad)}.dlt.wn{color:var(--warn)}.dlt.nt{color:var(--dim)}
.best{font-size:13px;font-weight:700;letter-spacing:.12em;padding:0 7px;border:1px solid var(--accent);color:var(--accent-2)}
.sortchip{font-size:15px;font-weight:600;letter-spacing:.06em;color:#cfd6dc;border:1px dashed #4b5158;padding:2px 10px}
.sortchip:hover{color:#fff;border-color:var(--accent-2)}
.cg-empty .cg-sub{font-size:15px}

/* ---------- 0.4.1 · experiment "overview": free-socket summary ---------- */
.valrow.sum{align-items:flex-end;gap:14px}
.valrow.sum .vcol{display:flex;flex-direction:column;gap:4px;min-width:0}
.valrow.sum .vcol:last-child{flex:1}
.valrow.sum .val b{font-size:32px}
.valrow.sum .val svg{width:20px;height:20px}
.valrow.sum .dslot{width:58px;justify-content:flex-start}
.valrow.sum .sks{display:flex;gap:4px;align-items:center;height:32px}
.valrow.sum .sk{flex:1;display:flex;align-items:center;gap:4px;line-height:1;white-space:nowrap}
.valrow.sum .sk b{font-size:24px}
.valrow.sum .sk i{font-style:normal;font-size:16px;font-weight:600;color:var(--dim)}
.valrow.sum .sk .d{font-size:14px;font-weight:700}
#stage.ux-ov .st{padding-top:4px;padding-bottom:4px}
#stage.ux-ov .cats{padding:2px 14px 6px}
#stage.ux-ov .cg .target{padding:6px 18px 2px}

/* ---------- 0.4.1 · experiment "bigText": larger type, more contrast on dim text ---------- */
#stage.ux-big{--dim:#9aa3ab}
#stage.ux-big #build{font-size:15px;color:#8a939b}
#stage.ux-big .gp.pill{font-size:14px}
#stage.ux-big .sec-title span{font-size:16px}
#stage.ux-big .slot.pv-add .nm::after{font-size:16px}
#stage.ux-big .head small{font-size:16px}
#stage.ux-big .pw-row .lbl{font-size:16px}
#stage.ux-big .st .sl{font-size:15px;letter-spacing:.05em}
#stage.ux-big .st .sl i{font-size:14px;color:#8a939b}
#stage.ux-big .st .sv small{font-size:16px}
#stage.ux-big .st .sd{font-size:16px}
#stage.ux-big .hstat{font-size:15px}
#stage.ux-big .tip .tipbox{font-size:16px}
#stage.ux-big .tipnum{font-size:15px}
#stage.ux-big .valrow .rl{font-size:16px}
#stage.ux-big .cg .target{font-size:16px}
#stage.ux-big .cat{font-size:15px;letter-spacing:.02em}
#stage.ux-big .cat i{color:#8a939b}
#stage.ux-big .cg-row .act{font-size:15px;letter-spacing:.06em}
#stage.ux-big .cg-empty{color:#8a939b}
#stage.ux-big .cg-empty .cg-sub{font-size:16px}
#stage.ux-big .slot.empty .ic,#stage.ux-big .slot.empty .nm,#stage.ux-big .slot.free .nm{color:#8a939b}
#stage.ux-big .slot.free .nm{font-size:18px}
#stage.ux-big .tag3d small{font-size:15px}
#stage.ux-big .vhint{font-size:16px;color:#8a939b}
#stage.ux-big #card .ch .fam,#stage.ux-big #card .ch .tg{font-size:15px}
#stage.ux-big #card th{font-size:15px}
#stage.ux-big #card .emptyc,#stage.ux-big #card small.tot,#stage.ux-big .kidchip i{color:#8a939b}
#stage.ux-big .retline{font-size:16px}
#stage.ux-big .bunl small{font-size:13px}
#stage.ux-big .pk-head small{font-size:16px}
#stage.ux-big .bc-head small,#stage.ux-big .bc-stats span{font-size:15px}
#stage.ux-big .bc-use{font-size:14px}
#stage.ux-big .hint.off{color:#6f7982}
#stage.ux-big .inputpill{font-size:14px;color:#8a939b}
#stage.ux-big .dbgbtn{font-size:14px}
#stage.ux-big .sortchip{font-size:16px}
#stage.ux-big .cg-row .sub{font-size:17px}
#stage.ux-big .best{font-size:14px}
</style>
</head>
