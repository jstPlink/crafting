services:
  crafting:
    # image published by the GitHub Actions workflow (update on the NAS: docker compose pull && docker compose up -d)
    image: ghcr.io/jstplink/crafting:latest
    # or build it locally: docker compose up -d --build
    build: .
    container_name: crafting
    restart: unless-stopped
    ports:
      # host port : container port  (change 6480 if it is taken on the NAS)
      - "${CRAFTING_PORT:-6480}:80"
