server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    gzip on;
    gzip_types text/css application/javascript application/json model/gltf-binary;

    # the mockup changes often: always revalidate html/js, cache the vendor libs
    location / {
        add_header Cache-Control "no-cache";
        try_files $uri $uri/ =404;
    }
    location /vendor/ {
        add_header Cache-Control "public, max-age=604800";
    }
}
